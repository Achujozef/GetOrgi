{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow p-4 w-100" style="max-width: 400px;">
        <h4 class="text-center text-success mb-3">Login with Mobile</h4>

        {% if messages %}
        <div>
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="mobile" class="form-label">Mobile Number</label>
                <input type="text" class="form-control" name="mobile" placeholder="Enter your mobile" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Continue Shopping</button>
            </div>
        </form>

        <p class="mt-3 text-muted text-center small">
            📍 Please allow location access for smooth delivery.
        </p>
    </div>
</div>

<!-- 🛠 Add this line for alert dismiss to work -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
